# ABSiCE att_distrib_param_eol Calibration Sweep — TORC/Slurm Workflow
#
# Purpose: find the att_mean value that produces ~20% recycling rate at the
#   baseline recycling cost (ratio 1.0) and initial recycling rate = 20%.
#
# RTN-optional: the `rtn` parameter sweeps both modes in a single job spec via
#   run_single_scenario.py --rtn {rtn}. The cost lever is --ratio 1.0
#   (baseline), which is mode-neutral — it means "baseline recycling cost" in
#   whichever mode (RTN shipment cost, or original_recycling_cost in non-RTN).
#   (Do NOT use --cost-rate here: it is an RTN-anchored $/kg value and would
#   scale the non-RTN $/metric-ton lever incorrectly.)
#
# Setup:
#   - 6 att_mean values × 2 rtn modes × 1 landfill set = 12 jobs
#   - 100 replicates per job, 11 simulation years each
#   - att_std fixed at 0.1 (Saphores 2012 calibration)
#   - Output: results/att_calibration/[rtn|nortn]/att_mean_X.XX/recycle_rate_20pct/...
#
# To calibrate a SINGLE mode only, set the `rtn` parameter list to just
# "['true']" (RTN) or "['false']" (non-RTN).
#
# Submission:
#   TORC_ACCOUNT=pvabm ./hpc/submit.sh att_calibration
#
# After the run completes, analyse results with:
#   python hpc/analyze_att_calibration.py --results-base results/att_calibration

name: absice_att_calibration
description: >
  ABSiCE att_distrib_param_eol calibration sweep (RTN-optional).
  Fixes recycling cost at baseline (ratio 1.0) and initial recycling rate at
  20%; sweeps the attitude distribution mean across both RTN and non-RTN modes
  via hpc/run_single_scenario.py. Each job runs 100 model iterations and writes
  results to results/att_calibration/.
project: ABSiCE

# ── Resource requirements per job ─────────────────────────────────────────────
resource_requirements:
  - name: scenario
    num_cpus: 4
    num_gpus: 0
    num_nodes: 1
    memory: 64g
    runtime: PT8H

slurm_schedulers:
  - name: cpu_nodes
    account: pvabm
    partition: standard
    nodes: 4
    walltime: "48:00:00"
    extra: "--mail-user=<YOUR_EMAIL> --mail-type=BEGIN,END,FAIL"

actions:
  - trigger_type: on_workflow_start
    action_type: schedule_nodes
    scheduler: cpu_nodes
    scheduler_type: slurm
    num_allocations: 1

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  # --landfill-set all_landfills below is only used by RTN jobs (--rtn true);
  # non-RTN jobs in this sweep ignore it (it does not affect the run or the
  # output label). It is kept in the shared command because a single job spec
  # cannot omit a flag per swept rtn value.
  - name: att_calib_all_landfills_rtn{rtn}_m{att_mean:.2f}
    command: >-
      module load conda &&
      conda activate <CONDA_ENV_PATH> &&
      python hpc/run_single_scenario.py
      --landfill-set all_landfills
      --ratio 1.0
      --cost-component recycling
      --rtn {rtn}
      --recycle-rate 0.20
      --att-mean {att_mean}
      --att-std 0.1
      --n-runs 100
      --n-steps 11
      --results-base results/att_calibration
    resource_requirements: scenario
    scheduler: cpu_nodes

    # ── Parameter sweep (Cartesian product: att_mean × rtn) ───────────────────
    # Finer grid between 0.60 and 0.65 (initial sweep showed 0.60 -> 8.2%,
    # 0.65 -> 25.2%; target is 20%). 6 att_mean × 2 rtn = 12 jobs.
    # Set rtn to "['true']" or "['false']" to calibrate a single mode.
    parameters:
      att_mean: "[0.60,0.61,0.62,0.63,0.64,0.65]"
      rtn: "['true','false']"
    parameter_mode: product

    failure_handler: retry_once

failure_handlers:
  - name: retry_once
    rules:
      - match_all_exit_codes: true
        max_retries: 1
