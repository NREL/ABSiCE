# hpc/rtn_base.yaml
#
# This file is kept as close as possible to config/default_simulation.yaml.
# ONLY the overrides REQUIRED for RTN calibration/sensitivity runs differ:
#   - run.last_step:                  1      -> 44 (11 years x 4 quarters)
#   - run.timestep:                   annual -> quarterly (RTN cost data is quarterly)
#   - consumer.model_states:          null   -> [TX, AZ, NV, NM] (RTN site subset)
#   - scenario.landfill_solar_waste_acceptance_ratio: 0.4 -> 1.0 (published-run value;
#         < 1.0 randomly drops sites)
#
# Everything else is intentionally identical to config/default_simulation.yaml,
# including network.num_consumers (inert under consumer.resolution: site, where
# ABM_CE_PV.get_num_consumers() uses uspvdb.shape[0]).
#
# data_source.rtn stays false here; hpc/scenario_runner.py flips it to True and
# sets the RTN cost filenames (Recycling data / RTN landfill data) per-scenario.
# eol.init_eol_rate (recycle=0.10) and tpb.att_distrib_param_eol ([0.515, 0.1])
# already match default_simulation.yaml and are overridden per-scenario.
